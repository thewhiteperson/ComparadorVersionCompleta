<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', path='css/product-search.css')}}">
    <link rel="stylesheet" href="{{url_for('static', path='css/header.css')}}">
    <title>Lista de Productos</title>
</head>
<script>
(function (m, a, z, e) {
  var s, t, u, v;
  try {
    t = m.sessionStorage.getItem('maze-us');
  } catch (err) {}

  if (!t) {
    t = new Date().getTime();
    try {
      m.sessionStorage.setItem('maze-us', t);
    } catch (err) {}
  }

  u = document.currentScript || (function () {
    var w = document.getElementsByTagName('script');
    return w[w.length - 1];
  })();
  v = u && u.nonce;

  s = a.createElement('script');
  s.src = z + '?apiKey=' + e;
  s.async = true;
  if (v) s.setAttribute('nonce', v);
  a.getElementsByTagName('head')[0].appendChild(s);
  m.mazeUniversalSnippetApiKey = e;
})(window, document, 'https://snippet.maze.co/maze-universal-loader.js', 'f4c97d47-9817-441d-b2e7-83dce98cb74e');
</script>
<body>
    <header class="header">
        {% include 'layouts/header.html' %} 
    </header>

    <main>
        <section class="search-section">
            {% include 'layouts/search-bar.html' %} 
        </section>

<section class="results">

{% if mensaje %}
<p class="error-message">{{ mensaje }}</p>
{% endif %}

{% for m in modelos %}
<div class="result-card">
    <div class="result-image">
        {% if m.imagen %}
            <img src="{{ m.imagen }}" alt="{{ m.modelo }}">
        {% endif %}
    </div>

    <div class="result-info">
        <h3>
            <a href="/product/{{ m.modelo | urlencode }}">
                {{ m.modelo }}
            </a>
        </h3>
        <p class="brand">{{ m.marca }}</p>
        <p class="description">{{ m.linea }}</p>
    </div>

    <div class="favorite">❤️</div>
</div>
{% endfor %}

</section>


    </main>
</body>
</html>
